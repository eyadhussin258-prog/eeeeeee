<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Callback - 𝐏𝐞𝐫𝐟𝐞𝐜𝐭 𝐂𝐅𝐖</title>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f0f1e;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .callback-container {
            text-align: center;
            padding: 2rem;
            background: #1a1a2e;
            border-radius: 1rem;
            border: 1px solid #2d2d4a;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
        }
        .loading {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .spinner {
            border: 3px solid #2d2d4a;
            border-top: 3px solid #9333ea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
        .success {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <h2>𝐏𝐞𝐫𝐟𝐞𝐜𝐭 𝐂𝐅𝐖</h2>
        <div class="loading">جاري تسجيل الدخول...</div>
        <div class="spinner"></div>
        <div id="status"></div>
    </div>

    <script>
        // Get authorization code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const statusDiv = document.getElementById('status');

        // Debug information
        console.log('Callback Debug Info:');
        console.log('URL:', window.location.href);
        console.log('Code:', code);
        console.log('Error:', error);
        console.log('Origin:', window.location.origin);

        if (error) {
            statusDiv.innerHTML = `<div class="error">فشل تسجيل الدخول: ${error}</div>`;
            console.error('Discord Error:', error);
            
            // Send error to parent window
            if (window.opener) {
                window.opener.postMessage({
                    type: 'discord_auth_error',
                    error: error
                }, window.location.origin);
            }
            
            setTimeout(() => {
                window.close();
            }, 3000);
        } else if (code) {
            console.log('Authorization code received:', code);
            
            // Send code to parent window
            if (window.opener) {
                console.log('Sending code to parent window...');
                window.opener.postMessage({
                    type: 'discord_auth_success',
                    code: code
                }, window.location.origin);
                
                statusDiv.innerHTML = '<div class="success">تم تسجيل الدخول بنجاح!</div>';
                
                setTimeout(() => {
                    window.close();
                }, 2000);
            } else {
                // Fallback for same window
                console.log('Using fallback method...');
                localStorage.setItem('discord_auth_code', code);
                window.location.href = 'http://localhost:8000/';
            }
        } else {
            statusDiv.innerHTML = '<div class="error">لم يتم العثور على رمز المصادقة</div>';
            setTimeout(() => {
                window.close();
            }, 3000);
        }
    </script>
</body>
</html>
